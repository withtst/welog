[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "welog"
version = "0.1.0"
description = "Local visual chat capture with overlap-corrected scroll coordinates"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "opencv-python-headless>=4.8,<5"]

[project.optional-dependencies]
windows = ["dxcam>=0.3,<0.4; platform_system == 'Windows'"]
gui = ["PySide6-Essentials>=6.8,<6.9"]
ocr = ["rapidocr>=3.10,<4", "onnxruntime>=1.20,<2"]
dev = ["pytest>=8,<10"]

[project.scripts]
welog = "welog.cli:main"

[project.gui-scripts]
welog-gui = "welog.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
